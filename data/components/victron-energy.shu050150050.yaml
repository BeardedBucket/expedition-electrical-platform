category: monitor
conductive_relationships:
  - id: smartshunt.main-shunt-conduction
    participants:
      - id: smartshunt.battery-minus
        kind: connection_point
      - id: smartshunt.system-minus
        kind: connection_point
connection_points:
  - id: smartshunt.aux
    notes: Aux configurable input.
  - id: smartshunt.battery-minus
    notes: BATTERY MINUS; 500A high-current terminal uses M10.
  - id: smartshunt.system-minus
    notes: SYSTEM MINUS; 500A high-current terminal uses M10.
  - id: smartshunt.vbatt-plus
    notes: Vbatt+ fused positive supply connection.
dimensions_mm:
  x: 120
  y: 54
  z: 46
electrical:
  input_voltage_range_v:
    max: 70
    min: 6.5
id: victron-energy.shu050150050
interaction_endpoints:
  - id: smartshunt.bluetooth
    kind: communication
    notes: Bluetooth / VictronConnect.
  - id: smartshunt.ve-direct
    kind: communication
    notes: VE.Direct data and settings interface.
manufacturer: Victron Energy
measurement:
  instances:
    - id: smartshunt.battery-voltage
      quantity: voltage
      target:
        id: smartshunt.vbatt-plus
        kind: connection_point
    - id: smartshunt.main-current
      quantity: current
      target:
        id: smartshunt.main-shunt-conduction
        kind: conductive_relationship
model: SmartShunt 500A/50mV
part_number: SHU050150050
physical_connector_associations:
  - connector_id: smartshunt.ve-direct.connector
    id: smartshunt.ve-direct.connector-association
    target:
      id: smartshunt.ve-direct
      kind: interaction_endpoint
physical_connectors:
  - designation: VE.Direct
    id: smartshunt.ve-direct.connector
    type: communication
product_family: SmartShunt
product_role: monitor
